baseURL: "https://joaopedro-hub.github.io/potfolio/"
languageCode: pt-br
build:
  writeStats: true
locale: pt-br
title: "João Pedro | Portfólio"
# Uncomment below to use aafu as hugo theme. See instructions in README.md
theme: aafu

params:
  author: João Pedro
  description: Portfólio profissional de João Pedro
  copyright: powered by [hugo](https://gohugo.io/)
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
  accordion:
    - item: about_me
      expand: true # only the first `expand: true` will take effect
    - item: experiences
    - item: education
    - item: projects
    - item: skills
      panel_id: skill-panel
    - item: hobbies

markup:
  goldmark:
    renderer:
      unsafe: true

security:
  exec:
    allow:
      - '^tailwindcss$'
      - '^npx$'
      - '^npm$'
  funcs:
    getenv:
      - '^HUGO_'
      - '^TZ$'      